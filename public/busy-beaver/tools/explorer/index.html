<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space-time Explorer</title>
<meta name="description" content="Interactive space-time diagrams of Turing machines: zoom from a billion steps to single steps, with every view labelled.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Cpath d='M2 2h2v12H2zM6 4h2v10H6zM10 7h2v7h-2z' fill='%23eee'/%3E%3Crect x='12' y='5' width='2' height='2' fill='%23f33'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/busy-beaver/tools/explorer/explorer.css">
<style>.stale{display:none!important}</style></head>
<body><aside style="padding:9px 18px;background:#e8eff3;color:#23323c;font:13px/1.5 system-ui;border-bottom:1px solid #aebbc4;position:relative;z-index:10">Static snapshot · 2026-10-17 04:33 UTC · <a style="color:inherit;text-decoration:underline" href="/work/busycoq/">Back to portfolio</a>. Statuses reflect the capture date.</aside>
<div id="app" class="app">
  <header id="topbar" class="topbar">
    <div class="tb-left">
      <span class="brand" title="BB(6) space-time explorer">STX</span>
      <input id="tm" class="tm-field" type="text" spellcheck="false" autocomplete="off" placeholder="paste a machine, e.g. 1RB1LC_1RC1RB_... or a bbchallenge.org link" aria-label="Turing machine">
      <button class="btn" data-act="apply-tm" tabindex="-1" title="Open this machine (Enter)">⏎</button>
      <span class="sep"></span>
      <button class="btn" data-act="prev-machine" tabindex="-1" title="Previous machine (Shift+N)">◀</button>
      <button class="btn mlist" data-act="machines" tabindex="-1" title="Machine list"><span id="mpos">–/–</span></button>
      <button class="btn" data-act="next-machine" tabindex="-1" title="Next machine (n)">▶</button>
      <button class="btn" data-act="presets" tabindex="-1" title="Presets: the pilot cards, labelled">Presets</button>
      <span class="sep"></span>
      <span class="seg" id="steps-seg" role="group" aria-label="Steps to simulate"><button class="btn" type="button" tabindex="-1" data-steps="1000000" title="simulate 1,000,000 steps">1e6</button><button class="btn" type="button" tabindex="-1" data-steps="10000000" title="simulate 10,000,000 steps">1e7</button><button class="btn" type="button" tabindex="-1" data-steps="100000000" title="simulate 100,000,000 steps">1e8</button><button class="btn" type="button" tabindex="-1" data-steps="1000000000" title="simulate 1,000,000,000 steps">1e9</button><button class="btn" type="button" tabindex="-1" data-steps="10000000000" title="simulate 10,000,000,000 steps">1e10</button></span>
      <button class="btn" data-act="steps-x10" tabindex="-1" title="Simulate 10× more">×10</button>
      <button class="btn" data-act="steps-d10" tabindex="-1" title="Simulate 10× fewer">÷10</button>
      <button class="btn" data-act="run-toggle" tabindex="-1" id="run-toggle" title="Pause / resume the simulation">❚❚</button>
    </div>
    <div class="tb-status" id="status"><span class="status-text">no machine</span><span class="bar"><span class="bar-fill" id="status-bar"></span></span></div>
    <div class="tb-right">
      <button class="btn" data-act="copy-link" tabindex="-1" title="Copy a link to exactly this view (Shift+C)"><span class="lg">Copy&nbsp;</span>link</button>
      <button class="btn" data-act="export" tabindex="-1" title="Export PNG with label and legend (e)"><span class="lg">Export&nbsp;</span>PNG</button>
      <a class="btn link" id="site-link" href="https://bbchallenge.org" target="_blank" rel="noopener" tabindex="-1" title="Open this machine on bbchallenge.org">bbchallenge ↗</a>
      <button class="btn" data-act="theme" tabindex="-1" title="Page theme: auto / light / dark" id="theme-btn">◐</button>
      <button class="btn" data-act="toggle-panels" tabindex="-1" title="Show / hide the side panels (\)">▥</button>
      <button class="btn" data-act="help" tabindex="-1" title="Keys and help (?)">?</button>
    </div>
  </header>

  <section id="label" class="label" aria-live="off">
    <div class="lrow"><b>Start</b><span id="l-start" class="ltxt"></span></div>
    <div class="lrow"><b>Rows</b><span id="l-rows" class="ltxt"></span></div>
    <div class="lrow"><b>Window</b><span id="l-window" class="ltxt"></span></div>
    <div class="lrow"><b>Colors</b><span id="l-colors" class="ltxt"></span></div>
  </section>

  <main class="main" id="main">
    <aside id="left" class="panel left"></aside>
    <section class="stage" id="stage">
      <div class="corner" id="corner" title="Rows: real step numbers on the left; cells on top"></div>
      <canvas id="ruler-top" class="ruler-top"></canvas>
      <canvas id="ruler-left" class="ruler-left"></canvas>
      <div class="view" id="view">
        <canvas id="cv-base" class="cv"></canvas>
        <canvas id="cv-over" class="cv over"></canvas>
        <div id="pane-tags" class="pane-tags"></div>
        <div id="site-overlay" class="site-overlay" hidden></div>
        <div id="empty" class="empty" hidden></div>
      </div>
    </section>
    <aside id="right" class="panel right"></aside>
  </main>

  <section id="tapestrip" class="tapestrip"></section>
  <footer id="hoverbar" class="hoverbar"><span id="hover-text">hover the diagram: step, cell and what one pixel holds</span></footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="popover" class="popover" hidden></div>
  <div id="help" class="help" hidden></div>
</div>
<script type="module" src="/busy-beaver/tools/explorer/ui/main.mjs"></script>
</body>
</html>
